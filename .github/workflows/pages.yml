name: Deploy web playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules used by the web build
        run: |
          git submodule update --init raylib raygui physac web/lua

      - name: Install host Lua (used to run the binding generator)
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build web engine + IDE
        run: bash web/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
